<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="chimp scratching head">
  <!-- head silhouette (white, merges with ears/hand) -->
  <g fill="#ffffff">
    <!-- crown fur tufts -->
    <circle cx="42" cy="44" r="9"/>
    <circle cx="54" cy="37" r="10"/>
    <circle cx="67" cy="38" r="9"/>
    <!-- head -->
    <ellipse cx="60" cy="72" rx="33" ry="31" transform="rotate(-8 60 72)"/>
    <!-- left ear (chimp ears stick out) -->
    <ellipse cx="21" cy="70" rx="12.5" ry="15.5" transform="rotate(-10 21 70)"/>
    <!-- right ear -->
    <ellipse cx="100" cy="58" rx="11" ry="13.5" transform="rotate(12 100 58)"/>
    <!-- body/shoulder hint entering from bottom-right -->
    <circle cx="106" cy="120" r="16"/>
    <!-- raised arm reaching over the head -->
    <path d="M104 120 C 106 92, 98 62, 76 38" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <!-- scratching hand on the scalp -->
    <circle cx="71" cy="35" r="9.5"/>
    <circle cx="62" cy="27" r="4.5"/>
    <circle cx="70" cy="24.5" r="4.5"/>
    <circle cx="78" cy="28" r="4.5"/>
  </g>
  <!-- ear inner detail -->
  <ellipse cx="21.5" cy="71" rx="6" ry="8.5" transform="rotate(-10 21.5 71)" fill="#0a78c8" opacity="0.5"/>
  <ellipse cx="100.5" cy="59" rx="5" ry="7.5" transform="rotate(12 100.5 59)" fill="#0a78c8" opacity="0.5"/>
  <!-- muzzle: lower and narrower, chimp-like protruding jaw -->
  <ellipse cx="62" cy="92" rx="17" ry="12" fill="#d9ecfa"/>
  <!-- brows: one raised, puzzled -->
  <path d="M45 56 Q 52 50 59 53" fill="none" stroke="#123c5e" stroke-width="3" stroke-linecap="round"/>
  <path d="M69 52 Q 76 50 82 55" fill="none" stroke="#123c5e" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="51" cy="64" r="4.4" fill="#123c5e"/>
  <circle cx="75" cy="63" r="4.4" fill="#123c5e"/>
  <circle cx="52.5" cy="62.5" r="1.4" fill="#ffffff"/>
  <circle cx="76.5" cy="61.5" r="1.4" fill="#ffffff"/>
  <!-- nostrils -->
  <ellipse cx="57" cy="91" rx="1.9" ry="2.5" fill="#0a78c8"/>
  <ellipse cx="67" cy="90.4" rx="1.9" ry="2.5" fill="#0a78c8"/>
  <!-- puzzled mouth -->
  <path d="M54 99 Q 64 104 74 98" fill="none" stroke="#0a78c8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- scratching sparks -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M50 14 L54 22"/>
    <path d="M68 9 L69 18"/>
    <path d="M86 12 L82 20"/>
  </g>
</svg>
